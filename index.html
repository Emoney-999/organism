<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Recursive Organism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060608;
    --surface: #0d0d10;
    --border: #1a1a22;
    --teal: #01696f;
    --teal-bright: #01a8b0;
    --teal-dim: rgba(1,105,111,0.25);
    --teal-glow: rgba(1,168,176,0.12);
    --white: #f0f0f0;
    --mid: #888;
    --dim: #444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Mono', monospace;
  }

  /* ── LAYOUT ──────────────────────────────── */
  #app {
    display: flex;
    width: 100vw; height: 100vh;
    position: relative;
  }

  #diagram-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  #detail-pane {
    width: 0;
    overflow: hidden;
    transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    border-left: 1px solid transparent;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    position: relative;
  }

  #detail-pane.open {
    width: 380px;
    border-left-color: var(--border);
  }

  /* ── HEADER ─────────────────────────────── */
  #header {
    position: absolute;
    top: 24px; left: 0; right: 0;
    text-align: center;
    z-index: 2;
    pointer-events: none;
  }
  #header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(13px, 2vw, 17px);
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--white);
    text-transform: uppercase;
  }
  #header p {
    font-size: 8px;
    color: var(--teal);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
    opacity: 0.8;
  }

  /* ── HINT ────────────────────────────────── */
  #hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: var(--dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: pulse-hint 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse-hint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ── SVG DIAGRAM ─────────────────────────── */
  #organism-svg {
    width: min(70vh, 88vw);
    height: min(70vh, 88vw);
    overflow: visible;
  }

  /* Rings */
  .ring-membrane { fill: none; stroke: var(--teal); stroke-width: 1.5; }
  .ring-iris { fill: none; stroke: var(--teal); stroke-width: 1; opacity: 0.2; }
  .ring-pupil { fill: none; stroke: var(--teal); stroke-width: 1.5; }
  .center-dot { fill: var(--teal); }
  .center-dot-outer { fill: none; stroke: var(--teal); stroke-width: 1; opacity: 0.3; }

  /* Rotation arc */
  .rotation-arc { fill: none; stroke: var(--teal); stroke-width: 1; opacity: 0.25; stroke-dasharray: 3 5; }
  .rotation-arrow { fill: var(--teal); opacity: 0.35; }

  /* Steps */
  .step-node {
    cursor: pointer;
    transition: all 0.2s;
  }
  .step-node circle {
    fill: var(--bg);
    stroke: var(--teal);
    stroke-width: 1;
    transition: all 0.25s;
  }
  .step-node text {
    fill: var(--white);
    font-family: 'Syne', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 0.06em;
    pointer-events: none;
  }
  .step-node:hover circle,
  .step-node.active circle {
    fill: var(--teal-dim);
    stroke: var(--teal-bright);
    stroke-width: 1.8;
    filter: drop-shadow(0 0 8px rgba(1,168,176,0.5));
  }
  .step-node.active text { fill: var(--teal-bright); }

  /* Connecting arc segments */
  .flow-arc { fill: none; stroke: var(--teal); stroke-width: 1; opacity: 0.3; }
  .flow-arc-active { opacity: 0.7; stroke: var(--teal-bright); }

  /* Intelligence nodes */
  .intel-node {
    cursor: pointer;
  }
  .intel-node circle {
    fill: var(--bg);
    stroke: var(--teal);
    stroke-width: 1.5;
    transition: all 0.25s;
  }
  .intel-node text.name {
    fill: var(--white);
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 0.05em;
    pointer-events: none;
  }
  .intel-node text.role {
    fill: var(--teal);
    font-family: 'DM Mono', monospace;
    font-size: 6.5px;
    text-anchor: middle;
    letter-spacing: 0.15em;
    pointer-events: none;
  }
  .intel-node:hover circle,
  .intel-node.active circle {
    fill: var(--teal-dim);
    stroke: var(--teal-bright);
    stroke-width: 2;
    filter: drop-shadow(0 0 10px rgba(1,168,176,0.5));
  }
  .intel-node.active text.name { fill: var(--teal-bright); }

  /* Energy flow lines */
  .energy-line { fill: none; stroke: var(--teal); stroke-width: 1; stroke-dasharray: 3 6; opacity: 0.2; }
  .energy-line.active { opacity: 0.6; stroke: var(--teal-bright); stroke-dasharray: 4 4; animation: dash-flow 1.2s linear infinite; }
  @keyframes dash-flow { to { stroke-dashoffset: -16; } }

  /* ── DETAIL PANE ─────────────────────────── */
  #detail-inner {
    padding: 32px 28px 28px;
    opacity: 0;
    transition: opacity 0.3s 0.15s;
    overflow-y: auto;
    height: 100%;
  }
  #detail-pane.open #detail-inner { opacity: 1; }

  #detail-tag {
    font-size: 7px;
    letter-spacing: 0.25em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #detail-title {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: var(--white);
    margin-bottom: 6px;
    line-height: 1;
  }
  #detail-subtitle {
    font-size: 9px;
    color: var(--teal);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .detail-block { margin-bottom: 22px; }
  .detail-block-label {
    font-size: 7px;
    letter-spacing: 0.25em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .detail-block-content {
    font-size: 11.5px;
    line-height: 1.7;
    color: #c8c8c8;
    font-weight: 300;
  }
  .detail-block-content strong {
    color: var(--white);
    font-weight: 500;
  }

  .detail-action {
    background: var(--teal-glow);
    border: 1px solid var(--teal-dim);
    padding: 14px 16px;
    margin: 22px 0;
    font-size: 12px;
    line-height: 1.65;
    color: var(--teal-bright);
  }

  .detail-action::before {
    content: '▸ NOW:';
    display: block;
    font-size: 7px;
    letter-spacing: 0.2em;
    color: var(--teal);
    margin-bottom: 6px;
  }

  .failure-block {
    border-left: 2px solid #ff4444;
    padding: 10px 14px;
    margin-top: 22px;
    background: rgba(255,68,68,0.05);
  }
  .failure-block::before {
    content: '⚠ FAILURE MODE';
    display: block;
    font-size: 7px;
    letter-spacing: 0.2em;
    color: #ff4444;
    margin-bottom: 6px;
  }
  .failure-block p {
    font-size: 10.5px;
    line-height: 1.6;
    color: #ff7777;
  }

  #close-btn {
    position: absolute;
    top: 18px; right: 18px;
    width: 28px; height: 28px;
    background: var(--border);
    border: none;
    color: var(--mid);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 10;
  }
  #close-btn:hover { background: var(--teal-dim); color: var(--white); }

  /* ── MOBILE ──────────────────────────────── */
  @media (max-width: 640px) {
    #detail-pane.open {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      width: 100% !important;
      height: 65vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    #organism-svg {
      width: min(85vw, 75vh);
      height: min(85vw, 75vh);
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="diagram-pane">
    <div id="header">
      <h1>The Recursive Organism</h1>
      <p>Tap a node to expand its module</p>
    </div>

    <svg id="organism-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#01a8b0" opacity="0.6"/>
        </marker>
      </defs>

      <!-- RINGS -->
      <circle cx="250" cy="250" r="220" class="ring-membrane"/>
      <circle cx="250" cy="250" r="168" class="ring-iris"/>
      <circle cx="250" cy="250" r="128" class="ring-iris"/>
      <circle cx="250" cy="250" r="82"  class="ring-pupil"/>

      <!-- CENTER -->
      <circle cx="250" cy="250" r="22"  class="center-dot-outer"/>
      <circle cx="250" cy="250" r="5"   class="center-dot"/>

      <!-- FLOW ARCS between steps (drawn on ring r=105) -->
      <!-- Arc segments connecting each step around the circle -->
      <path id="arc-0" class="flow-arc" d="M 250,145 A 105,105 0 0,1 341,197"/>
      <path id="arc-1" class="flow-arc" d="M 341,197 A 105,105 0 0,1 341,303"/>
      <path id="arc-2" class="flow-arc" d="M 341,303 A 105,105 0 0,1 250,355"/>
      <path id="arc-3" class="flow-arc" d="M 250,355 A 105,105 0 0,1 159,303"/>
      <path id="arc-4" class="flow-arc" d="M 159,303 A 105,105 0 0,1 159,197"/>
      <path id="arc-5" class="flow-arc" d="M 159,197 A 105,105 0 0,1 250,145"/>

      <!-- ENERGY LINES from intelligences to center -->
      <line id="el-ai"       class="energy-line" x1="250" y1="30"  x2="250" y2="228"/>
      <line id="el-synaptic" class="energy-line" x1="441" y1="360" x2="272" y2="262"/>
      <line id="el-emoney"   class="energy-line" x1="59"  y1="360" x2="228" y2="262"/>

      <!-- FLYWHEEL STEPS — positioned on r=105 ring -->
      <!-- EXECUTE (top, 270°) -->
      <g class="step-node" data-id="execute" onclick="selectNode('execute')">
        <circle cx="250" cy="145" r="28"/>
        <text x="250" y="145">EXECUTE</text>
      </g>
      <!-- RECORD (top-right, 330°) -->
      <g class="step-node" data-id="record" onclick="selectNode('record')">
        <circle cx="341" cy="197" r="28"/>
        <text x="341" y="197">RECORD</text>
      </g>
      <!-- EVALUATE (bottom-right, 30°) -->
      <g class="step-node" data-id="evaluate" onclick="selectNode('evaluate')">
        <circle cx="341" cy="303" r="28"/>
        <text x="341" y="303">EVALUATE</text>
      </g>
      <!-- MODIFY (bottom, 90°) -->
      <g class="step-node" data-id="modify" onclick="selectNode('modify')">
        <circle cx="250" cy="355" r="28"/>
        <text x="250" y="355">MODIFY</text>
      </g>
      <!-- STANDARDIZE (bottom-left, 150°) -->
      <g class="step-node" data-id="standardize" onclick="selectNode('standardize')">
        <circle cx="159" cy="303" r="28"/>
        <text x="159" y="301">STD.</text>
      </g>
      <!-- CYCLE (top-left, 210°) -->
      <g class="step-node" data-id="cycle" onclick="selectNode('cycle')">
        <circle cx="159" cy="197" r="28"/>
        <text x="159" y="197">CYCLE</text>
      </g>

      <!-- INTELLIGENCE NODES on membrane -->
      <!-- AI (top, 90° = 270° standard) -->
      <g class="intel-node" data-id="ai" onclick="selectNode('ai')">
        <circle cx="250" cy="30" r="30"/>
        <text class="name" x="250" y="27">AI</text>
        <text class="role" x="250" y="40">COMPUTE</text>
      </g>
      <!-- SYNAPTIC (bottom-right) -->
      <g class="intel-node" data-id="synaptic" onclick="selectNode('synaptic')">
        <circle cx="441" cy="360" r="30"/>
        <text class="name" x="441" y="357">SYN</text>
        <text class="role" x="441" y="370">STRUCTURE</text>
      </g>
      <!-- EMONEY (bottom-left) -->
      <g class="intel-node" data-id="emoney" onclick="selectNode('emoney')">
        <circle cx="59" cy="360" r="30"/>
        <text class="name" x="59" y="357">EM</text>
        <text class="role" x="59" y="370">FORCE</text>
      </g>
    </svg>

    <div id="hint">tap any node</div>
  </div>

  <!-- DETAIL PANE -->
  <div id="detail-pane">
    <button id="close-btn" onclick="closePane()">✕</button>
    <div id="detail-inner">
      <div id="detail-tag"></div>
      <div id="detail-title"></div>
      <div id="detail-subtitle"></div>
      <div id="detail-body"></div>
    </div>
  </div>
</div>

<script>
const NODES = {
  execute: {
    tag: "Flywheel · Stage 01",
    title: "EXECUTE",
    subtitle: "Take the action. Full commitment. No half-measures.",
    what: "You have a standard. You have a target. You go. This is the moment where all preparation converts into reality. The flywheel starts here.",
    now: "Pick up the phone. Send the demo link. Book the call. Do the one thing on your list right now — not after one more prep.",
    gys: "You are in <strong>EXECUTE</strong> every time you dial. Every call is a unit of execution. One dial = one data point entering the system.",
    failure: "You are stuck in prep. You're updating the script instead of running it. You're optimizing before you have data. Preparation without execution is just delay."
  },
  record: {
    tag: "Flywheel · Stage 02",
    title: "RECORD",
    subtitle: "Capture exactly what happened. No interpretation yet.",
    what: "The action is done. Now you freeze the outcome before your brain rewrites it. You are collecting raw data — not stories, not excuses. What <em>actually</em> happened.",
    now: "Log it immediately. STRIKE_LIST: RESULT + VM_LEFT + SIGNAL + one-word objection bucket. Do not skip this. Memory is not record.",
    gys: "After every call: open STRIKE_LIST, fill the post-call columns. One line. Thirty seconds. This is how the system learns.",
    failure: "You skip logging because 'you'll remember.' You don't. After 20 calls, the data is gone and the patterns die with it. The flywheel cannot spin without fuel."
  },
  evaluate: {
    tag: "Flywheel · Stage 03",
    title: "EVALUATE",
    subtitle: "Look at the data. Find the signal inside the noise.",
    what: "You have records. Now you read them. You are not looking for a story — you are looking for a pattern. What keeps showing up? What is the system trying to tell you?",
    now: "After 10+ data points: scan your STRIKE_LIST. What's the most common objection? Where do leads go cold? One pattern is enough to act on.",
    gys: "Review SIGNAL scores. If most leads are 3–5, the hook isn't working. If leads qualify but don't close, the CAM flow needs adjustment. Let the data speak.",
    failure: "You evaluate after 1–2 calls. That's not signal, that's noise. Or you never evaluate — you just keep executing the same broken loop forever."
  },
  modify: {
    tag: "Flywheel · Stage 04",
    title: "MODIFY",
    subtitle: "Change one variable. Exactly one. Not three.",
    what: "You've identified a pattern. Now you make a decision: what one thing do you change? You are a scientist. You change one variable so you know what moved the needle.",
    now: "Identify the one thing. Change the opener, or the timing, or the hook framing. Change ONE thing and be able to name it.",
    gys: "If the hook isn't landing: modify the first 10 seconds of Standard V4. If the demo isn't converting: modify the CAM_CLOSE guarantee language. One thing at a time.",
    failure: "You change everything at once after a bad day. Now you don't know what fixed it — or what broke it. You've destroyed the signal. You're back to zero data."
  },
  standardize: {
    tag: "Flywheel · Stage 05",
    title: "STANDARDIZE",
    subtitle: "Lock the improvement in. Make it permanent.",
    what: "The change worked. Now you make it official. If you don't write it down, it doesn't exist. The next version of you needs to operate from the new standard — not from memory.",
    now: "Update Standard V4, or Gem 4's prompt, or DOCTRINE.md. Wherever the change lives: update the source of truth. The improvement must survive your next bad day.",
    gys: "The GYS knowledge system IS your STANDARDIZE layer. Every improvement that doesn't make it into ODIN's project files is eventually lost. Write it down.",
    failure: "You improve mentally but never write it down. Three weeks later, you're running the old script again. The drift is invisible until you're back at the beginning."
  },
  cycle: {
    tag: "Flywheel · Stage 06",
    title: "CYCLE",
    subtitle: "The loop closes. You go again — better.",
    what: "You have a new standard. The flywheel has completed one revolution. You return to EXECUTE, but you are not the same operator who started. The loop compounds.",
    now: "You have the updated standard in hand. Go back to EXECUTE. The next call is the first call of the improved cycle.",
    gys: "This is how GYS gets sharper with every call. Call 1 → data → improvement → Call 2 is better. By call 50, the system is unrecognizable. This is the compounding that wins.",
    failure: "You wait to cycle until everything is perfect. There is no perfect. The flywheel only has value in motion. Sitting still is the only failure mode here."
  },
  ai: {
    tag: "Intelligence Layer · Compute",
    title: "AI",
    subtitle: "Computational force. The layer that processes what you can't.",
    what: "AI handles scale, pattern recognition, and optimization at speeds and volumes no human can match. It doesn't get tired. It doesn't forget. It doesn't get emotional after a bad call.",
    now: "Feed it clean data. The AI layer (Claude, Gemini, ODIN) is only as good as what you put in. Your RECORD discipline is the fuel for this engine.",
    gys: "Gem 1 → Gem 2 → Gem 4 → ODIN. Lead creation, enrichment, hook generation, call card output, CRM intelligence. The entire pipeline is your AI layer in motion.",
    failure: "You stop logging. The AI layer loses its input. It can't learn from calls you didn't record. It can't find patterns in data that doesn't exist."
  },
  synaptic: {
    tag: "Intelligence Layer · Structure",
    title: "SYNAPTIC",
    subtitle: "The philosophy layer. The laws that prevent drift.",
    what: "SYNAPTIC is the structural intelligence — the accumulated frameworks, laws, and doctrines that encode hard-won learning. Without it, every generation of the loop starts from scratch.",
    now: "When you're confused about what to do: go to DOCTRINE.md. The answer is already there. If it's not there, write it after you figure it out.",
    gys: "SYNAPTIC_LAW_001 (Human Primacy), SYNAPTIC_LAW_002 (Recursive Flywheel), DOCTRINE, ICP, ASPI_KERNEL — these are the crystallized laws. They exist so you don't re-learn the same lesson twice.",
    failure: "You ignore the laws when under pressure. You blend scripts that should stay separate. You break LMRD rules. Every time you violate a law, you pay the tax the law was written to eliminate."
  },
  emoney: {
    tag: "Intelligence Layer · Force",
    title: "EMONEY",
    subtitle: "The irreducible human force. Creativity. Conviction. Presence.",
    what: "This is you. The operator. The one who reads the room in real-time, transfers conviction across a phone line, and makes decisions no system can make. This is the tip of the spear.",
    now: "Stop waiting for a perfect system to execute a perfect call. You are the creative force. The system exists to support you, not replace you. Pick up the phone.",
    gys: "SYNAPTIC_LAW_001 exists because of this node. Finding, reading, and getting in front of a prospect is irreducibly human. AI sets the table. You close the deal.",
    failure: "You outsource your judgment to the system. You wait for Gem 4 to tell you how to feel about a lead. You lose the conviction that makes the call land. The system amplifies force — it cannot generate it."
  }
};

let currentNode = null;

function selectNode(id) {
  const data = NODES[id];
  if (!data) return;

  // Deactivate previous
  document.querySelectorAll('.step-node, .intel-node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.energy-line').forEach(l => l.classList.remove('active'));

  // Activate current
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.add('active');

  // Activate energy line if intelligence node
  if (['ai','synaptic','emoney'].includes(id)) {
    const line = document.getElementById(`el-${id}`);
    if (line) line.classList.add('active');
  }

  // Populate detail pane
  document.getElementById('detail-tag').textContent = data.tag;
  document.getElementById('detail-title').textContent = data.title;
  document.getElementById('detail-subtitle').textContent = data.subtitle;

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-block">
      <div class="detail-block-label">What it is</div>
      <div class="detail-block-content">${data.what}</div>
    </div>
    <div class="detail-action">${data.now}</div>
    <div class="detail-block">
      <div class="detail-block-label">In GYS</div>
      <div class="detail-block-content">${data.gys}</div>
    </div>
    <div class="failure-block"><p>${data.failure}</p></div>
  `;

  document.getElementById('detail-pane').classList.add('open');
  document.getElementById('hint').style.opacity = '0';
  currentNode = id;
}

function closePane() {
  document.getElementById('detail-pane').classList.remove('open');
  document.querySelectorAll('.step-node, .intel-node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.energy-line').forEach(l => l.classList.remove('active'));
  document.getElementById('hint').style.opacity = '1';
  currentNode = null;
}
</script>
</body>
</html>
